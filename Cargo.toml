[workspace]
resolver = "2"
members = ["crates/easyshow-core", "crates/easyshow-app"]

[workspace.package]
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "EasyShow — a lightweight, fast cross-platform image viewer"

[workspace.dependencies]
# --- easyshow-core ---
image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "qoi", "tga", "pnm",
] }
zune-jpeg = "0.5"
fast_image_resize = "6"
kamadak-exif = "0.6"
libloading = "0.9"
thiserror = "2"
log = "0.4"

# --- easyshow-app ---
eframe = { version = "0.37", default-features = false, features = [
    "glow", "x11", "default_fonts",
] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
env_logger = "0.11"
trash = "5"
# rfd: 只用 xdg-portal 后端(纯 Rust/D-Bus);默认特性会拉入系统 wayland-client,需开发包
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
