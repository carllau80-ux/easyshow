name: release

# Full builds for Linux, Windows and macOS. Pushing a v* tag creates a
# GitHub Release with all platform artifacts.
#
# Lite builds are frozen at 0.2.3 and are no longer published.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # Release 创建/资产上传

jobs:
  linux:
    name: Linux (.deb / tar.gz / AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: deb + tarball
        run: bash packaging/build-linux.sh
      - name: AppImage
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/^\[workspace.package\]/{f=1} f&&/^version/{print $2; exit}' Cargo.toml)"
          curl -fsSL -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p dist/linux
          APP=easyshow; BIN=build/lin/easyshow
          APPDIR="build/appimage/EasyShow.AppDir"
          rm -rf "$APPDIR"; mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          install -m755 "$BIN" "$APPDIR/usr/bin/$APP"
          sed "s#Exec=/usr/bin/$APP#Exec=$APP#" "build/deb/${APP}_${VERSION}_amd64/usr/share/applications/$APP.desktop" > "$APPDIR/$APP.desktop"
          cp assets/icon-256.png "$APPDIR/$APP.png"
          cp assets/icon-256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/$APP.png"
          ./appimagetool --appimage-extract-and-run "$APPDIR" "dist/linux/EasyShow-${VERSION}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: easyshow-linux
          path: dist/linux/*

  windows:
    name: Windows (zip / Setup.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-libheif mingw-w64-x86_64-binutils
      - name: Collect HEIC runtime DLL closure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          echo "MSYSTEM=$MSYSTEM  mingw64 entries: $(ls /mingw64/bin | wc -l)"
          ls -la /mingw64/bin/libheif.dll
          if ! command -v objdump >/dev/null 2>&1; then
            echo "::error::objdump missing in msys2 MINGW64 environment"
            exit 1
          fi
          OBJDUMP=objdump bash packaging/windows/collect-dlls.sh /mingw64/bin build/win-dlls libheif.dll
          count=$(find build/win-dlls -name '*.dll' | wc -l)
          echo "closure DLLs: $count"
          if [ "$count" -lt 5 ]; then
            diag=$(objdump -p "$(cygpath -w /mingw64/bin/libheif.dll)" 2>&1 | head -6 | tr '\n' '~' || true)
            echo "::error::HEIC DLL closure incomplete ($count files); objdump=$(command -v objdump); output=$diag"
            exit 1
          fi
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build + package
        shell: bash
        env:
          MAKENSIS: /c/Program Files (x86)/NSIS/makensis.exe
          LIBS_DIR: build/win-dlls
        run: |
          set -o pipefail
          if ! bash packaging/windows/make-package.sh > build-package.log 2>&1; then
            {
              echo '### Windows packaging failed'
              echo '```'
              tail -n 150 build-package.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 8 build-package.log | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
          tail -n 30 build-package.log
      - uses: actions/upload-artifact@v4
        with:
          name: easyshow-windows
          path: dist/windows/*

  macos:
    name: macOS (.app / .dmg, universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Bundle + dmg
        run: |
          set -o pipefail
          if ! bash packaging/macos/make-bundle.sh universal both > build-bundle.log 2>&1; then
            {
              echo '### macOS packaging failed'
              echo '```'
              tail -n 150 build-bundle.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 8 build-bundle.log | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
          tail -n 30 build-bundle.log
      - uses: actions/upload-artifact@v4
        with:
          name: easyshow-macos
          path: dist/macos/*

  release:
    name: GitHub Release (all platforms)
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: |
          VERSION="$(awk -F'"' '/^\[workspace.package\]/{f=1} f&&/^version/{print $2; exit}' Cargo.toml)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.AppImage
            dist/**/*.exe
            dist/**/*.dmg
          body: |
            **EasyShow ${{ steps.ver.outputs.version }}** — a lightweight, fast desktop image viewer (full build).

            **Platforms**
            - Windows: portable zip with the libheif DLL closure, plus a per-user NSIS installer
            - Linux: .deb, portable tar.gz and AppImage
            - macOS: universal .dmg for Intel and Apple Silicon

            **Highlights**
            - Folder tree with Explorer-style chevrons, subfolder cards, year/month/day timeline
            - Fit-to-window by default, EXIF capture-time sorting, clickable GPS coordinates
            - One-click copy of EXIF, place name and coordinates; mandatory delete confirmation
            - Map mode with photo-thumbnail clusters and a full cluster gallery
            - Offline world basemap plus China province boundaries and labels
            - HEIC/AVIF, JPEG XL, SVG, PSD, HDR/EXR, animated GIF/WebP
            - Remembers the last browsed folder; bilingual UI and light/dark themes

            Full documentation: https://github.com/carllau80-ux/easyshow#readme
