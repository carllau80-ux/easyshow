name: release

# Windows full build. On a v* tag this workflow creates a GitHub Release
# with the portable zip and the NSIS installer.
#
# Linux/macOS jobs are intentionally disabled until the Windows build has
# been validated. Restore them from git history when publishing other
# platforms (see docs/PUBLISHING.md).
#
# Lite builds are frozen at 0.2.3 and are no longer published.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # Release 创建/资产上传

jobs:
  windows:
    name: Windows (zip / Setup.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-libheif mingw-w64-x86_64-binutils
      - name: Collect HEIC runtime DLL closure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          echo "MSYSTEM=$MSYSTEM  mingw64 entries: $(ls /mingw64/bin | wc -l)"
          ls -la /mingw64/bin/libheif.dll
          if ! command -v objdump >/dev/null 2>&1; then
            echo "::error::objdump missing in msys2 MINGW64 environment"
            exit 1
          fi
          OBJDUMP=objdump bash packaging/windows/collect-dlls.sh /mingw64/bin build/win-dlls libheif.dll
          count=$(find build/win-dlls -name '*.dll' | wc -l)
          echo "closure DLLs: $count"
          if [ "$count" -lt 5 ]; then
            diag=$(objdump -p "$(cygpath -w /mingw64/bin/libheif.dll)" 2>&1 | head -6 | tr '\n' '~' || true)
            echo "::error::HEIC DLL closure incomplete ($count files); objdump=$(command -v objdump); output=$diag"
            exit 1
          fi
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build + package
        shell: bash
        env:
          MAKENSIS: /c/Program Files (x86)/NSIS/makensis.exe
          LIBS_DIR: build/win-dlls
        run: |
          set -o pipefail
          if ! bash packaging/windows/make-package.sh > build-package.log 2>&1; then
            {
              echo '### Windows packaging failed'
              echo '```'
              tail -n 150 build-package.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 8 build-package.log | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
          tail -n 30 build-package.log
      - uses: actions/upload-artifact@v4
        with:
          name: easyshow-windows
          path: dist/windows/*

  release:
    name: GitHub Release (Windows full)
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: |
          VERSION="$(awk -F'"' '/^\[workspace.package\]/{f=1} f&&/^version/{print $2; exit}' Cargo.toml)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.zip
            dist/**/*.exe
          body: |
            **EasyShow ${{ steps.ver.outputs.version }}** — a lightweight, fast desktop image viewer (Windows full build).

            **Highlights**
            - Folder tree, subfolder cards with covers, year/month/day timeline
            - Fit-to-window by default, EXIF capture-time sorting, one-click copy of EXIF/location
            - Map mode with photo-thumbnail clusters (up to 4 per cluster) and a full cluster gallery
            - Offline world basemap plus China province boundaries and labels
            - HEIC/AVIF, JPEG XL, SVG, PSD, HDR/EXR, animated GIF/WebP
            - Remembers the last browsed folder (state.json)

            **Assets**
            - `easyshow-${{ steps.ver.outputs.version }}-windows-x86_64-full.zip` — portable (includes the libheif DLL closure)
            - `EasyShow-${{ steps.ver.outputs.version }}-Full-Setup.exe` — per-user installer

            > This release is Windows-only for now. Linux/macOS packages will follow after the Windows build has been validated.

            Full feature list and documentation: https://github.com/carllau80-ux/easyshow#readme
